name: Publish API client

on:
  push:
    tags:
      - "api-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.2.0)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#api-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Set package version
        run: npm pkg set version="${{ steps.version.outputs.value }}" --workspace @generatenu/api

      - name: Build
        run: npm run build --workspace @generatenu/api

      - name: Publish
        run: npm publish --workspace @generatenu/api
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
